template_id: envelope
name: "Envelope / Mailer"
description: >
  Flat envelope or document mailer with a fold-over flap.
  Suitable for sending documents, photos, flat items.

parameters:
  - name: width
    label: "Width (mm)"
    type: float
    default: 220.0
    min: 50.0
    max: 600.0
    step: 0.5
    unit: mm
    group: "Envelope Dimensions"

  - name: height
    label: "Height (mm)"
    type: float
    default: 110.0
    min: 30.0
    max: 400.0
    step: 0.5
    unit: mm
    group: "Envelope Dimensions"

  - name: flap_height
    label: "Flap Height (mm)"
    type: float
    default: 40.0
    min: 15.0
    max: 100.0
    step: 0.5
    unit: mm
    group: "Flap Settings"

  - name: flap_style
    label: "Flap Style"
    type: select
    default: "diagonal"
    options: ["straight", "diagonal", "rounded"]
    group: "Flap Settings"

  - name: side_flap_width
    label: "Side Flap Width (mm)"
    type: float
    default: 15.0
    min: 5.0
    max: 40.0
    step: 0.5
    unit: mm
    group: "Flap Settings"

  - name: bottom_flap_height
    label: "Bottom Flap Height (mm)"
    type: float
    default: 20.0
    min: 10.0
    max: 50.0
    step: 0.5
    unit: mm
    group: "Flap Settings"

  - name: perforation
    label: "Add Tear-Off Perforation"
    type: bool
    default: false
    group: "Options"

  - name: bleed
    label: "Bleed Margin (mm)"
    type: float
    default: 3.0
    min: 0.0
    max: 10.0
    step: 0.5
    unit: mm
    group: "Print Settings"
