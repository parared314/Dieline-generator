template_id: tuck_top_box
name: "Tuck-Top Box"
description: >
  Standard retail box with tuck-in top and bottom flaps.
  Suitable for cosmetics, small electronics, food items.

parameters:
  - name: width
    label: "Width (mm)"
    type: float
    default: 80.0
    min: 20.0
    max: 500.0
    step: 0.5
    unit: mm
    group: "Box Dimensions"

  - name: height
    label: "Height (mm)"
    type: float
    default: 120.0
    min: 20.0
    max: 800.0
    step: 0.5
    unit: mm
    group: "Box Dimensions"

  - name: depth
    label: "Depth (mm)"
    type: float
    default: 40.0
    min: 5.0
    max: 300.0
    step: 0.5
    unit: mm
    group: "Box Dimensions"

  - name: flap_height
    label: "Tuck Flap Height (mm)"
    type: float
    default: 20.0
    min: 5.0
    max: 60.0
    step: 0.5
    unit: mm
    group: "Flap Settings"

  - name: glue_tab_width
    label: "Glue Tab Width (mm)"
    type: float
    default: 12.0
    min: 5.0
    max: 25.0
    step: 0.5
    unit: mm
    group: "Flap Settings"

  - name: perforation
    label: "Add Perforation on Bottom Flap"
    type: bool
    default: false
    group: "Options"

  - name: bleed
    label: "Bleed Margin (mm)"
    type: float
    default: 3.0
    min: 0.0
    max: 10.0
    step: 0.5
    unit: mm
    group: "Print Settings"
